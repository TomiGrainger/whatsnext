# Fly.io config — see DEPLOY.md for the steps.
#
# Two things here matter more than the rest:
#   • min_machines_running / auto_stop_machines keep one machine awake, so the
#     app never sleeps mid-event and long-lived SSE streams aren't cut.
#   • the app keeps room state in memory and in one file, so it must run as
#     exactly ONE machine. Don't scale this out.

app = "whatsnext"                 # must match the app name on Fly
primary_region = "lhr"            # London; use `fly platform regions` for others

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true              # Fly terminates TLS and forwards X-Forwarded-Proto
  auto_stop_machines = false      # never sleep — an event is a bad time to cold start
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    # Every phone holds one event-stream connection open for the whole event,
    # plus short-lived ones for each vote, so the ceiling needs to be well above
    # the size of the room. Measured locally: 366 concurrent connections cost
    # about 37MB, so the memory below is not the limit here.
    soft_limit = 400
    hard_limit = 800

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

# Everything written at run time lives here so a redeploy doesn't lose the
# night: rooms_state.json, the events you author, debrief sign-ups and the
# profile photos people upload.
[mounts]
  source = "upgrade_data"
  destination = "/data"

# 256MB is deliberate, not a guess: idle is ~23MB and a room of 366 connected
# phones measured ~37MB. Bump it only if you actually see memory pressure.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
